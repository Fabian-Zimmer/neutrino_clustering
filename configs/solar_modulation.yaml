# Annual modulation: one year of the Sun's gravity on neutrinos arriving at
# Earth (paper 3). The Earth sits at the origin and the Sun moves.
#
#   sbatch -t 00:10:00 --cpus-per-task=32 --mem=56000 slurm/run.job scripts/make_solar_time_steps.py configs/solar_modulation.yaml
#   sbatch -t 01:00:00 slurm/run.job scripts/simulate.py configs/solar_modulation.yaml
#   sbatch -t 03:00:00 slurm/run.job scripts/annual_modulation/make_density_data.py configs/solar_modulation.yaml
#   sbatch -t 00:05:00 --cpus-per-task=32 --mem=56000 slurm/run.job scripts/annual_modulation/analytical_modulation_safdi.py configs/solar_modulation.yaml

run_dir: runs/SunMod_1k                 # parameters and outputs of this run
data_dir: data/halo_grids               # precalculated grids (can be shared between runs)
box_directory: /projects/0/prjs0781/simulation_data/Tango_sims   # raw SWIFT box (Snellius)

box:                                    # scripts/make_box.py
  initial_snap_z0: 36
  final_snap_z4: 12

parameters:                             # scripts/make_parameters.py
  healpix_nside: 8
  nu_mass_start: 0.01                   # eV, mass range for total densities
  nu_mass_stop: 0.3
  nu_mass_num: 50
  nu_sim_mass: 0.3                      # eV, mass used to turn momenta into velocities
  specific_masses: [0.01, 0.05, 0.1, 0.2, 0.3]
  p_start: 0.01                         # momenta in units of T_CNB
  p_stop: 400.0
  p_num: 1000
  p_spacing: log                        # log (*_1k runs) or linear (SunMod_PSD* runs)
  init_x_dis: 8.178                     # kpc, Earth's distance from the halo centre
  z_int_shift: 0.1
  z_int_stop: 4.0
  z_int_num: 100
  CPUs_precalculations: 128
  CPUs_simulations: 128
  memory_limit_GB: 224
  DM_in_cell_limit: 1000

halos:                                  # halo sample from the box's halo catalogue
  mass_gauge: 12.0                      # log10(M/Msun) and range [lower, upper] x 1e12 Msun
  mass_lower: 0.6
  mass_upper: 2.0
  halo_num: 30
  skip: [20]                            # halo 20 has no DM position data at snapshot 0012

precalculate:
  sim_type: halos                       # halos | benchmark

simulate:
  mode: solar_modulation
  sun_gravity: true
  day_step: 12                          # every 12th day of the year
  # The high-resolution SunMod_PSD* runs (Nside 32-128, 100 linear momenta, see
  # dm_halos_psd_nside32.yaml) only simulated two days, instead of day_step:
  # days: [125, 305]                    # back in time: 365-240=125, 365-60=305
  skymap_masses: [0.01, 0.05, 0.1, 0.2, 0.3]   # eV, masses for pixel_densities.npy
  testing: false                        # true: only the first pixel, no multiprocessing

annual_modulation:                      # scripts/annual_modulation/make_density_data.py
  prefix: SunMod_1k_all_halos
  days_vectors_subdir: SunMove_Dopri5_wrtMW   # folder in run_dir with vectors_day*.npy ("." = run_dir)
  with_DM_gravity: true                 # phase-space density from the DM halo runs ...
  interp_grav_psd: true                 # ... interpolated (false: Fermi-Dirac; see note in script)
  halo_num: 30
  Earth_frame: true
  Earth_rel_Sun: false
  rel_vel: MW                           # MW or CNB, only used if Earth_rel_Sun is false
  day_step: 12
  integrate_pixels: true
  bound: null                           # null: all momenta (true/false: see note in script)
  masses: [0.15, 0.2, 0.25, 0.3, 0.01]  # eV
